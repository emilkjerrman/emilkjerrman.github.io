<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diploma Exhibition, Academy of Fine Arts Leipzig</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>

  <style>
  .grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 1.5rem;
    align-items: start;
  }

  .gallery-item {
    transition: all 0.3s ease;
    background: transparent;
  }

  .gallery-item:hover {
    transform: scale(0.98);
  }

  .gallery-item img {
    width: 100%;
    height: auto;
    display: block;
  }

  @media (max-width: 768px) {
    .grid-container {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body class="bg-gray-100 font-sans">
  <header class="py-6 px-4 md:px-8">
    <div class="container mx-auto flex justify-between items-center">
      <a href="/index.html" class="text-2xl font-bold">Emil Kjerrman</a>

      <nav>
        <ul class="flex space-x-6">
          <li><a href="/about.html" class="hover:text-gray-600">ABOUT</a></li>
          <li><a href="/shows.html" class="hover:text-gray-600">UPCOMING AND CURRENT SHOWS</a></li>
          <li><a href="/contact.html" class="hover:text-gray-600">CONTACT</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="py-12 px-4 md:px-8">
    <div class="container mx-auto">
      <div class="mb-12">
        <h1 class="text-4xl font-light mb-2">Untergeschoss14 Spinnerei</h1>
        <p class="text-gray-600">Diploma Exhibition, Academy of Fine Arts Leipzig, 2026.</p>
      </div>

      <div class="grid-container">
        <div class="gallery-item" data-aos="fade-up">
          <img src="/images/diplom1.jpg" alt="Diploma Exhibition 1">
        </div>

        <div class="gallery-item" data-aos="fade-up" data-aos-delay="100">
          <img src="/images/diplom2.jpg" alt="Diploma Exhibition 2">
        </div>

        <div class="gallery-item" data-aos="fade-up" data-aos-delay="200">
          <img src="/images/diplom3.jpg" alt="Diploma Exhibition 3">
        </div>

        <div class="gallery-item" data-aos="fade-up" data-aos-delay="300">
          <img src="/images/diplom4.jpg" alt="Diploma Exhibition 4">
        </div>

        <div class="gallery-item" data-aos="fade-up" data-aos-delay="400">
          <img src="/images/diplom5.jpg" alt="Diploma Exhibition 5">
        </div>

        <div class="gallery-item" data-aos="fade-up" data-aos-delay="500">
          <img src="/images/diplom6.jpg" alt="Diploma Exhibition 6">
        </div>

        <div class="gallery-item" data-aos="fade-up" data-aos-delay="600">
          <img src="/images/diplom7.jpg" alt="Diploma Exhibition 7">
        </div>

        <div class="gallery-item" data-aos="fade-up" data-aos-delay="700">
          <img src="/images/diplom8.jpg" alt="Diploma Exhibition 8">
        </div>

        <div class="gallery-item" data-aos="fade-up" data-aos-delay="800">
          <img src="/images/diplom9.jpg" alt="Diploma Exhibition 9">
        </div>
      </div>
    </div>
  </main>

  <footer class="py-8 px-4 md:px-8 bg-gray-900 text-white">
    <div class="container mx-auto text-center">
      <p>© 2025 Emil Kjerrman. All rights reserved.</p>

      <div class="flex justify-center space-x-4 mt-4">
        <a href="https://www.instagram.com/emil_kjerrman/" target="_blank" rel="noopener noreferrer" class="hover:text-gray-400">
          <i data-feather="instagram"></i>
        </a>
      </div>
    </div>
  </footer>

  <script>
    AOS.init({
      duration: 800,
      easing: 'ease-in-out',
      once: true
    });

    feather.replace();
  </script>
</body>
</html>
