<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narratives forever | Væg Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .gallery-item {
            transition: all 0.3s ease;
        }
        .gallery-item:hover {
            transform: scale(0.98);
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <header class="py-6 px-4 md:px-8">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold">Emil Kjerrman</a>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="#" class="hover:text-gray-600">About</a></li>
                    <li><a href="#" class="hover:text-gray-600">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="py-12 px-4 md:px-8">
        <div class="container mx-auto">
            <div class="mb-12">
<h1 class="text-4xl font-light mb-2">Narratives forever | </h1>
<p class="text-gray-600">
  2025 • 
  <a href="http://vaeg-gallery.dk/?p=6206" 
     class="text-blue-600 hover:underline" 
     target="_blank" 
     rel="noopener noreferrer">
    Væg Contemporary Gallery
  </a>
</p>
            </div>
            
            <div class="grid-container">
                <div class="gallery-item" data-aos="fade-up">
                    <img src="/images/rum bedre1.jpg" alt="Artwork 1" class="w-full h-auto object-cover">
                </div>
                <div class="gallery-item" data-aos="fade-up" data-aos-delay="100">
                    <img src="/images/painting1.jpg" alt="Artwork 2" class="w-full h-auto object-cover">
                </div>
                <div class="gallery-item" data-aos="fade-up" data-aos-delay="200">
                    <img src="/images/rum bedre2.jpg" alt="" class="w-full h-auto object-cover">
                </div>
                <div class="gallery-item" data-aos="fade-up">
                    <img src="" alt="" class="w-full h-auto object-cover">
                </div>
                <div class="gallery-item" data-aos="fade-up" data-aos-delay="100">
                    <img src="" alt="" class="w-full h-auto object-cover">
                </div>
                <div class="gallery-item" data-aos="fade-up" data-aos-delay="200">
                    <img src="" alt="" class="w-full h-auto object-cover">
                </div>
            </div>
        </div>
    </main>

    <footer class="py-8 px-4 md:px-8 bg-gray-900 text-white">
        <div class="container mx-auto text-center">
            <p>©  Emil Kjerrman. All rights reserved.</p>
            <div class="flex justify-center space-x-4 mt-4">
                <a href="#" class="hover:text-gray-400"><i data-feather="instagram"></i></a>
        
            </div>
        </div>
    </footer>

    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-in-out',
            once: true
        });
        feather.replace();
    </script>
</body>
</html>
