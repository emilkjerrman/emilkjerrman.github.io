<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Åbn PDF</title>
  <!-- 🔁 Fallback: meta-refresh hvis JS er slået fra -->
  <meta http-equiv="refresh" content="1; url=./Unavngivet.pdf">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial,sans-serif;background:#0b0b0c;color:#f2f3f5;display:grid;place-items:center;height:100dvh;margin:0}
    .card{max-width:720px;background:#151517;border:1px solid #26262a;border-radius:16px;padding:22px;text-align:center}
    a.btn{display:inline-block;margin-top:10px;padding:10px 14px;border:1px solid #2c2f36;border-radius:10px;color:#f2f3f5;text-decoration:none}
    code{background:#101215;border:1px solid #26262a;padding:2px 6px;border-radius:6px}
    .qr{margin-top:14px}
    .qr img{max-width:180px;border:1px solid #26262a;border-radius:12px;background:#0b0b0c;padding:8px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Åbner PDF…</h1>
    <p>Hvis intet sker: <a id="direct" class="btn" href="./Unavngivet.pdf">Åbn PDF her</a></p>
    <p>Filsti: <code id="path">./Unavngivet.pdf</code></p>

    <div class="qr">
      <p>QR‑kode direkte til PDF’en:</p>
      <img id="qr" alt="QR til PDF" />
    </div>
  </div>

  <script>
    // ⚙️ Indstil navnet på din PDF her:
    const FILE = "Unavngivet.pdf";

    // Redirect med det samme
    const target = `./${FILE}`;
    try { window.location.replace(target); } catch (e) { window.location.href = target; }

    // Opdater fallback-link, label og QR-kode
    document.getElementById('direct').href = target;
    document.getElementById('path').textContent = target;
    const encoded = encodeURIComponent(new URL(target, window.location.href).href);
    document.getElementById('qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=10&data=${encoded}`;
  </script>
</body>
</html>
