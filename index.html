    <style>
        .project-item {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .project-item:hover {
            transform: scale(0.98);
        }
        .project-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 1rem;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .project-item:hover .project-overlay {
            transform: translateY(0);
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <style>
  /* Grid på forsiden */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr)); /* 3 kolonner */
    gap: 20px;                                         /* hvid plads imellem */
    max-width: 1100px;
    margin: 2rem auto;
  }

  /* Ens billedstørrelse via aspect-ratio (responsivt og pænt) */
  .thumb-box {
    aspect-ratio: 4 / 3;   /* vælg 1/1, 4/3, 16/9 – hvad du vil */
    width: 100%;
    overflow: hidden;
    border-radius: 8px;     /* valgfri afrunding */
  }
  .thumb-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;      /* gør alle thumbnails ens uden at strække */
    display: block;
  }

  /* Mobil: 1 kolonne (justér hvis du vil have 2) */
  @media (max-width: 768px) {
    .grid-container {
      grid-template-columns: 1fr;
    }
  }
</style>
