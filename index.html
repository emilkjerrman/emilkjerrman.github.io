<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Emil Kjerrman</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>

  <style>
    /* ÉT samlet grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 2rem auto;
    }
    /* Ens thumbnail-størrelse via aspect-ratio */
    .thumb-box {
      aspect-ratio: 4 / 3;   /* skift til 1/1 eller 16/9 hvis du vil */
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
    }
    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* Mobil: 1 kolonne */
    @media (max-width: 768px) {
      .grid-container { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body class="bg-gray-100 font-sans">
  <header class="py-6 px-4 md:px-8">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Emil Kjerrman</h1>
      <nav>
        <ul class="flex space-x-6">
          <li><a href="#" class="hover:text-gray-600">WORKS</a></li>
          <li><a href="#" class="hover:text-gray-600">ABOUT</a></li>
          <li><a href="#" class="hover:text-gray-600">UPCOMING AND CURRENT SHOWS</a></li>
          <li><a href="#" class="hover:text-gray-600">CONTACT</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="py-12 px-4 md:px-8">
    <div class="container mx-auto">
      <!-- ÉN grid-container: fjernede det gamle “Project 1–6”-afsnit -->
      <div class="grid-container">
        <a href="new-gallery.html" class="project-item">
          <div class="thumb-box"><img src="/images/Fresko0.jpg" alt="Exhibition 1"></div>
        </a>
        <a href="new-gallery1.html" class="project-item">
          <div class="thumb-box"><img src="/images/Fresko2.jpg" alt="Exhibition 2"></div>
        </a>
        <a href="new-gallery2.html" class="project-item">
          <div class="thumb-box"><img src="/images/painting1.jpg" alt="Exhibition 3"></div>
        </a>
        <a href="new-gallery3.html" class="project-item">
          <div class="thumb-box"><img src="/images/painting2.jpg" alt="Exhibition 4"></div>
        </a>
        <a href="new-gallery4.html" class="project-item">
          <div class="thumb-box"><img src="/images/painting3.jpg" alt="Exhibition 5"></div>
        </a>
        <a href="new-gallery5.html" class="project-item">
          <div class="thumb-box"><img src="/images/Fresko5.jpg" alt="Exhibition 6"></div>
        </a>
      </div>
    </div>
  </main>

  <footer class="py-8 px-4 md:px-8 bg-gray-900 text-white">
    <div class="container mx-auto text-center">
      <p>© 2025 Emil Kjerrman. All rights reserved.</p>
      <div class="flex justify-center space-x-4 mt-4">
        <a href="#" class="hover:text-gray-400"><i data-feather="instagram"></i></a>
      </div>
    </div>
  </footer>

  <script>
    AOS.init({ duration: 800, easing: 'ease-in-out', once: true });
    feather.replace();
  </script>
</body>
</html>
