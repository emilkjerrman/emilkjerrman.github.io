<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emil Kjerrman</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .project-item {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .project-item:hover {
            transform: scale(0.98);
        }
        .project-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 1rem;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .project-item:hover .project-overlay {
            transform: translateY(0);
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <header class="py-6 px-4 md:px-8">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Emil Kjerrman</h1>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="#" class="hover:text-gray-600">About</a></li>
                    <li><a href="#" class="hover:text-gray-600">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="py-12 px-4 md:px-8">
        <div class="container mx-auto">
            <h2 class="text-3xl font-light mb-12 text-center"></h2>
            
            <div class="grid-container">
                <!-- Project 1 -->
                <a href="new-gallery.html" class="project-item" data-aos="fade-up">
                    <img src="Fresko0.jpg" alt="Exhibition 1" class="w-full h-auto object-cover">
                    <div class="project-overlay">
                       
                    </div>
                </a>
                
                <!-- Project 2 -->
                <a href="new-gallery1.html" class="project-item" data-aos="fade-up" data-aos-delay="100">
                    <img src="Fresko2.jpg" alt="Fresko2.jpg" class="w-full h-auto object-cover">
                    <div class="project-overlay">
                        <h3 class="text-xl">Exhibition Title 2</h3>
                        <p class="text-sm">2022 • Gallery Name</p>
                    </div>
                </a>
                
                <!-- Project 3 -->
                <a href="painting1.jpg" class="project-item" data-aos="fade-up" data-aos-delay="200">
                    <img src="http://static.photos/art/1200x630/3" alt="Exhibition 3" class="w-full h-auto object-cover">
                    <div class="project-overlay">
                        <h3 class="text-xl">Exhibition Title 3</h3>
                        <p class="text-sm">2021 • Gallery Name</p>
                    </div>
                </a>
                
                <!-- Project 4 -->
                <a href="new-gallery3.html" class="project-item" data-aos="fade-up">
                    <img src="painting2.jpg" alt="Exhibition 4" class="w-full h-auto object-cover">
                    <div class="project-overlay">
                        <h3 class="text-xl">Exhibition Title 4</h3>
                        <p class="text-sm">2020 • Gallery Name</p>
                    </div>
                </a>
                
                <!-- Project 5 -->
                <a href="new-gallery4.html" class="project-item" data-aos="fade-up" data-aos-delay="100">
                    <img src="painting3.jpg" alt="painting3.jpg" class="w-full h-auto object-cover">
                    <div class="project-overlay">
                        <h3 class="text-xl">Exhibition Title 5</h3>
                        <p class="text-sm">2019 • Gallery Name</p>
                    </div>
                </a>
                
                <!-- Project 6 -->
                <a href="new-gallery5.html" class="project-item" data-aos="fade-up" data-aos-delay="200">
                    <img src="http://static.photos/art/1200x630/6" alt="Exhibition 6" class="w-full h-auto object-cover">
                    <div class="project-overlay">
                        <h3 class="text-xl">Exhibition Title 6</h3>
                        <p class="text-sm">2018 • Gallery Name</p>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <footer class="py-8 px-4 md:px-8 bg-gray-900 text-white">
        <div class="container mx-auto text-center">
            <p>© 2025 Emil Kjerrman. All rights reserved.</p>
            <div class="flex justify-center space-x-4 mt-4">
                <a href="#" class="hover:text-gray-400"><i data-feather="instagram"></i></a>
                <a href="#" class="hover:text-gray-400"><i data-feather="twitter"></i></a>
                <a href="#" class="hover:text-gray-400"><i data-feather="facebook"></i></a>
            </div>
        </div>
    </footer>

    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-in-out',
            once: true
        });
        feather.replace();
    </script>
</body>
</html>
